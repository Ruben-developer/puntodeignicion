<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900" role="img" aria-labelledby="titulo-el-acorazado-potemkin desc-el-acorazado-potemkin">
  <title id="titulo-el-acorazado-potemkin">Cartel de El acorazado Potemkin</title>
  <desc id="desc-el-acorazado-potemkin">Cartel generado para la Videoteca Ácrata Punto de Ignición: El acorazado Potemkin, 1925, dirigida por Sergei Eisenstein.</desc>
  <defs>
    <pattern id="trama" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#241d25" opacity=".18"/>
    </pattern>
    <filter id="grano" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch" result="ruido"/>
      <feColorMatrix in="ruido" type="saturate" values="0" result="gris"/>
      <feComponentTransfer in="gris" result="tenue">
        <feFuncA type="table" tableValues="0 .12"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="tenue" mode="multiply"/>
    </filter>
  </defs>

  <rect width="600" height="900" fill="#17131c"/>
  <rect x="20" y="20" width="560" height="860" fill="#e5d3b3"/>
  <rect x="20" y="20" width="560" height="860" fill="url(#trama)" opacity=".7"/>
  <rect x="32" y="32" width="536" height="836" fill="none" stroke="#7c1f1a" stroke-width="2" opacity=".9"/>
  <rect x="40" y="40" width="520" height="820" fill="none" stroke="#241d25" stroke-width="1" opacity=".35"/>

  <text x="300" y="62" text-anchor="middle" font-family="'Special Elite', 'Courier New', monospace" font-size="15" letter-spacing="4" fill="#241d25">VIDEOTECA ÁCRATA</text>
  <text x="300" y="84" text-anchor="middle" font-family="'Special Elite', 'Courier New', monospace" font-size="10" letter-spacing="3" fill="#7c1f1a">PUNTO DE IGNICIÓN · ARCHIVO FÍLMICO LIBRE</text>
  <path d="M70 102 L530 102" stroke="#7c1f1a" stroke-width="2" opacity=".7"/>

  <text x="300" y="500" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="235" fill="none" stroke="#7c1f1a" stroke-width="2" opacity=".12">1925</text>
  <rect x="65" y="125" width="470" height="405" fill="url(#trama)" opacity=".4"/>
  
      <g transform="translate(300 320)">
        <path d="M-165 0 Q0 -115 165 0 Q0 115 -165 0 Z" fill="#c59b27" opacity=".14"/>
        <path d="M-165 0 Q0 -115 165 0 Q0 115 -165 0 Z" fill="none" stroke="#7c1f1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="0" cy="0" r="62" fill="none" stroke="#7c1f1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="0" cy="0" r="24" fill="#7c1f1a" opacity=".75"/>
        <circle cx="18" cy="-18" r="8" fill="#c59b27"/>
        <path d="M-190 105 L-165 105 L-165 145 L-190 145 Z M-130 105 L-105 105 L-105 145 L-130 145 Z M-70 105 L-45 105 L-45 145 L-70 145 Z M-10 105 L15 105 L15 145 L-10 145 Z M50 105 L75 105 L75 145 L50 145 Z M110 105 L135 105 L135 145 L110 145 Z" fill="none" stroke="#7c1f1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

  <text x="300" y="598" text-anchor="middle" font-family="'Special Elite', 'Courier New', monospace" font-size="12" letter-spacing="2" fill="#7c1f1a">FICCIÓN SUBVERSIVA</text>
  <text text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="50" letter-spacing="1" fill="#241d25"><tspan x="300" y="666">EL ACORAZADO</tspan><tspan x="300" y="720">POTEMKIN</tspan></text>
  <text x="300" y="742" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#241d25" opacity=".75">Bronenosets Potyomkin</text>

  <path d="M60 758 L540 758" stroke="#7c1f1a" stroke-width="2"/>
  <text x="60" y="786" font-family="'Special Elite', 'Courier New', monospace" font-size="13" letter-spacing="2" fill="#7c1f1a">1925 · 1 h 13 min</text>
  <text x="540" y="786" text-anchor="end" font-family="'Special Elite', 'Courier New', monospace" font-size="11" letter-spacing="1" fill="#241d25" opacity=".8">Dominio público</text>
  <text x="60" y="816" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#241d25">Dir. Sergei Eisenstein</text>
  <text x="540" y="816" text-anchor="end" font-family="'Special Elite', 'Courier New', monospace" font-size="10" letter-spacing="2" fill="#7c1f1a">DESCARGA LIBRE</text>
  <g transform="translate(300 846)">
    <path d="M-135 0 L135 0" stroke="#241d25" stroke-width="1" opacity=".4"/>
    <circle cx="0" cy="0" r="3" fill="#7c1f1a"/>
  </g>
  <rect x="20" y="20" width="560" height="860" fill="none" stroke="#241d25" stroke-width="1" opacity=".2" filter="url(#grano)"/>
</svg>
