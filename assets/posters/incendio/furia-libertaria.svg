<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900" role="img" aria-labelledby="titulo-furia-libertaria desc-furia-libertaria">
  <title id="titulo-furia-libertaria">Cartel de Furia libertaria</title>
  <desc id="desc-furia-libertaria">Cartel de la sala Incendio para Furia libertaria, 1977, dirigida por Antonio Artero.</desc>
  <defs>
