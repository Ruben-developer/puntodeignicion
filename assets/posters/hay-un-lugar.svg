<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900" role="img" aria-labelledby="titulo-hay-un-lugar desc-hay-un-lugar">
  <title id="titulo-hay-un-lugar">Cartel de Hay un lugar: anarquistas de la Ciudad de México</title>
  <desc id="desc-hay-un-lugar">Cartel generado para la Videoteca Ácrata Punto de Ignición: Hay un lugar: anarquistas de la Ciudad de México, 2010, dirigida por Abril Schmucler.</desc>
  <defs>
    <pattern id="trama" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1d2a24" opacity=".18"/>
    </pattern>
    <filter id="grano" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch" result="ruido"/>
      <feColorMatrix in="ruido" type="saturate" values="0" result="gris"/>
      <feComponentTransfer in="gris" result="tenue">
        <feFuncA type="table" tableValues="0 .12"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="tenue" mode="multiply"/>
    </filter>
  </defs>

  <rect width="600" height="900" fill="#151d19"/>
  <rect x="20" y="20" width="560" height="860" fill="#e5d3b3"/>
  <rect x="20" y="20" width="560" height="860" fill="url(#trama)" opacity=".7"/>
  <rect x="32" y="32" width="536" height="836" fill="none" stroke="#8b261b" stroke-width="2" opacity=".9"/>
  <rect x="40" y="40" width="520" height="820" fill="none" stroke="#1d2a24" stroke-width="1" opacity=".35"/>

  <text x="300" y="62" text-anchor="middle" font-family="'Special Elite', 'Courier New', monospace" font-size="15" letter-spacing="4" fill="#1d2a24">VIDEOTECA ÁCRATA</text>
  <text x="300" y="84" text-anchor="middle" font-family="'Special Elite', 'Courier New', monospace" font-size="10" letter-spacing="3" fill="#8b261b">PUNTO DE IGNICIÓN · ARCHIVO FÍLMICO LIBRE</text>
  <path d="M70 102 L530 102" stroke="#8b261b" stroke-width="2" opacity=".7"/>

  <text x="300" y="500" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="235" fill="none" stroke="#8b261b" stroke-width="2" opacity=".12">2010</text>
  <rect x="65" y="125" width="470" height="405" fill="url(#trama)" opacity=".4"/>
  <g transform="translate(300 320) scale(1)">
      <g>
        <rect x="-145" y="-55" width="250" height="145" rx="10" fill="#c59b27" opacity=".14"/>
        <rect x="-145" y="-55" width="250" height="145" rx="10" fill="none" stroke="#8b261b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
