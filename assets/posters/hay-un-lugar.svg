        <path d="M-105 90 L-105 145 M105 90 L105 145" fill="none" stroke="#8b261b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M-45 125 L115 125" fill="none" stroke="#8b261b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>
