  <text x="300" y="570" text-anchor="middle" font-family="'Special Elite', 'Courier New', monospace" font-size="12" letter-spacing="2" fill="#8b261b">DOCUMENTALES LIBRES</text>
  <text text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="42" letter-spacing="1" fill="#1d2a24"><tspan x="300" y="630">HAY UN LUGAR:</tspan><tspan x="300" y="675">ANARQUISTAS DE LA</tspan><tspan x="300" y="720">CIUDAD DE MÉXICO</tspan></text>
