<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900" role="img" aria-labelledby="titulo-autonomia-obrera desc-autonomia-obrera">
  <title id="titulo-autonomia-obrera">Cartel de Autonomía obrera</title>
  <desc id="desc-autonomia-obrera">Cartel generado para la Videoteca Ácrata Punto de Ignición: Autonomía obrera, 2008, dirigida por Espai en Blanc.</desc>
  <defs>
    <pattern id="trama" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#251b15" opacity=".18"/>
    </pattern>
    <filter id="grano" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch" result="ruido"/>
      <feColorMatrix in="ruido" type="saturate" values="0" result="gris"/>
      <feComponentTransfer in="gris" result="tenue">
        <feFuncA type="table" tableValues="0 .12"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="tenue" mode="multiply"/>
    </filter>
  </defs>

  <rect width="600" height="900" fill="#241a12"/>
  <rect x="20" y="20" width="560" height="860" fill="#dcc7a6"/>
  <rect x="20" y="20" width="560" height="860" fill="url(#trama)" opacity=".7"/>
  <rect x="32" y="32" width="536" height="836" fill="none" stroke="#8b261b" stroke-width="2" opacity=".9"/>
  <rect x="40" y="40" width="520" height="820" fill="none" stroke="#251b15" stroke-width="1" opacity=".35"/>

  <text x="300" y="62" text-anchor="middle" font-family="'Special Elite', 'Courier New', monospace" font-size="15" letter-spacing="4" fill="#251b15">VIDEOTECA ÁCRATA</text>
  <text x="300" y="84" text-anchor="middle" font-family="'Special Elite', 'Courier New', monospace" font-size="10" letter-spacing="3" fill="#8b261b">PUNTO DE IGNICIÓN · ARCHIVO FÍLMICO LIBRE</text>
  <path d="M70 102 L530 102" stroke="#8b261b" stroke-width="2" opacity=".7"/>

  <text x="300" y="500" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="235" fill="none" stroke="#8b261b" stroke-width="2" opacity=".12">2008</text>
  <rect x="65" y="125" width="470" height="405" fill="url(#trama)" opacity=".4"/>
  <g transform="translate(300 320) scale(1)">
      <g>
        <path d="M-125 55 L-125 125 L125 125 L125 55 L75 20 L25 55 L-25 20 L-75 55 Z" fill="#b98a24" opacity=".14"/>
        <path d="M-125 55 L-125 125 L125 125 L125 55 L75 20 L25 55 L-25 20 L-75 55 Z" fill="none" stroke="#8b261b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M-95 55 L-95 -75 L-65 -75 L-65 55" fill="none" stroke="#8b261b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M-15 55 L-15 -115 L15 -115 L15 55" fill="none" stroke="#8b261b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M65 55 L65 -60 L95 -60 L95 55" fill="none" stroke="#8b261b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M-65 125 L-65 70 M0 125 L0 70 M65 125 L65 70" fill="none" stroke="#8b261b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".65"/>
        <circle cx="-95" cy="-105" r="18" fill="none" stroke="#8b261b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".7"/>
        <circle cx="-50" cy="-115" r="12" fill="none" stroke="#8b261b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".5"/>
        <circle cx="0" cy="-150" r="22" fill="none" stroke="#8b261b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".7"/>
        <circle cx="55" cy="-155" r="14" fill="none" stroke="#8b261b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".5"/>
      </g></g>

  <text x="300" y="577" text-anchor="middle" font-family="'Special Elite', 'Courier New', monospace" font-size="12" letter-spacing="2" fill="#8b261b">MEMORIA OBRERA</text>
  <text text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="60" letter-spacing="1" fill="#251b15"><tspan x="300" y="655">AUTONOMÍA</tspan><tspan x="300" y="720">OBRERA</tspan></text>
  <text x="300" y="742" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#251b15" opacity=".75">Autonomía obrera</text>

  <path d="M60 758 L540 758" stroke="#8b261b" stroke-width="2"/>
  <text x="60" y="786" font-family="'Special Elite', 'Courier New', monospace" font-size="13" letter-spacing="2" fill="#8b261b">2008 · 1 h 14 min</text>
  <text x="540" y="786" text-anchor="end" font-family="'Special Elite', 'Courier New', monospace" font-size="11" letter-spacing="1" fill="#251b15" opacity=".8">CC BY-NC-ND 3.0</text>
  <text x="60" y="816" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#251b15">Dir. Espai en Blanc</text>
  <text x="540" y="816" text-anchor="end" font-family="'Special Elite', 'Courier New', monospace" font-size="10" letter-spacing="2" fill="#8b261b">DESCARGA LIBRE</text>
  <g transform="translate(300 846)">
    <path d="M-135 0 L135 0" stroke="#251b15" stroke-width="1" opacity=".4"/>
    <circle cx="0" cy="0" r="3" fill="#8b261b"/>
  </g>
  <rect x="20" y="20" width="560" height="860" fill="none" stroke="#251b15" stroke-width="1" opacity=".2" filter="url(#grano)"/>
</svg>
